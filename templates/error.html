{% extends "base.html" %}

{% block container %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 62vh;">
    <div class="soft-card text-center" style="max-width: 520px; width: 100%; padding: 40px 32px;">
        <div class="badge-icon badge-amber mb-3" style="width: 84px; height: 84px; font-size: 2.1rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="page-title mb-2" style="font-size:1.4rem;">出错了</h2>
        <p style="color:var(--muted); font-size:.9rem; line-height:1.65;">{{ error }}</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="/" class="btn-pill btn-pill-primary"><i class="bi bi-house-door"></i> 返回首页</a>
            <button type="button" class="btn-pill" onclick="history.back()"><i class="bi bi-arrow-left"></i> 返回上一页</button>
        </div>
    </div>
</div>
{% endblock %}
