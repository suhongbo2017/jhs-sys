<aside class="side-rail d-print-none">
    <a href="/" class="rail-brand" title="金恒晟业务系统">
        <span class="rail-logo"><i class="bi bi-grid-1x2-fill"></i></span>
        <span class="rail-brand-text">金恒晟系统</span>
    </a>

    <nav class="rail-nav">
        <a href="/" class="rail-item" data-label="工作台" data-match="/">
            <i class="bi bi-house-door"></i><span>工作台</span>
        </a>
        <a href="/queryMaterial" class="rail-item" data-label="物料查询" data-match="/queryMaterial">
            <i class="bi bi-search"></i><span>物料查询</span>
        </a>
        <a href="/LSMqueryMaterial" class="rail-item" data-label="LSM 物料" data-match="/LSMqueryMaterial">
            <i class="bi bi-archive"></i><span>LSM 物料</span>
        </a>

        <div class="rail-sep"></div>

        <button type="button" class="rail-item" id="rail-print-btn" data-label="打印模板"
                data-match="/yunHaiPrint,/jinLiPrint,/jiuMaoPrint,/qianJi,/tongtaiying,/fengzhenchang,/fengzhenchang_copy,/zhidongli">
            <i class="bi bi-printer"></i><span>打印模板</span>
            <i class="bi bi-chevron-right rail-caret"></i>
        </button>

        <a href="/bartender_tag/" class="rail-item" data-label="BarTender" data-match="/bartender_tag">
            <i class="bi bi-upc-scan"></i><span>BarTender</span>
        </a>
        <a href="/date_tag_view" class="rail-item" data-label="月份标签" data-match="/date_tag">
            <i class="bi bi-calendar-date"></i><span>月份标签</span>
        </a>
        <a href="/qrcode" class="rail-item" data-label="二维码" data-match="/qrcode">
            <i class="bi bi-qr-code"></i><span>二维码</span>
        </a>
        <a href="/pdf_translate" class="rail-item" data-label="PDF 翻译" data-match="/pdf_translate">
            <i class="bi bi-file-earmark-pdf"></i><span>PDF 翻译</span>
        </a>
    </nav>

    <div class="rail-foot">
        <button type="button" class="rail-item" id="theme-toggle-btn" data-label="切换深浅色">
            <i class="bi bi-moon-stars" id="theme-icon"></i><span>切换主题</span>
        </button>
    </div>
</aside>

<!-- 打印模板飞出面板 -->
<div class="rail-flyout" id="rail-print-flyout">
    <div class="flyout-title">打印模板</div>
    <a href="/yunHaiPrint"><i class="bi bi-file-earmark-text"></i>云海模板</a>
    <a href="/jinLiPrint"><i class="bi bi-file-earmark-text"></i>金力模板</a>
    <a href="/jiuMaoPrint"><i class="bi bi-file-earmark-text"></i>九茂模板</a>
    <a href="/qianJi"><i class="bi bi-file-earmark-text"></i>千骥模板</a>
    <a href="/tongtaiying"><i class="bi bi-file-earmark-text"></i>同泰盈模板</a>
    <a href="/fengzhenchang"><i class="bi bi-file-earmark-text"></i>丰正昌模板</a>
    <a href="/fengzhenchang_copy"><i class="bi bi-file-earmark-text"></i>丰正昌模板 2</a>
    <a href="/zhidongli"><i class="bi bi-file-earmark-text"></i>智动力模板</a>
</div>

<script>
    (function () {
        // ---- 主题切换 ----
        const icon = document.getElementById('theme-icon');
        function paintIcon(theme) {
            if (!icon) return;
            icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
        }
        paintIcon(document.documentElement.getAttribute('data-bs-theme') || 'light');

        document.getElementById('theme-toggle-btn')?.addEventListener('click', () => {
            const html = document.documentElement;
            const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
            paintIcon(next);
        });

        // ---- 当前页高亮 ----
        const path = window.location.pathname;
        document.querySelectorAll('.rail-item[data-match]').forEach(el => {
            const matches = el.dataset.match.split(',').map(s => s.trim());
            if (matches.some(m => m === path || (m !== '/' && path.startsWith(m)))) {
                el.classList.add('active');
            }
        });

        // ---- 打印模板飞出面板 ----
        const btn = document.getElementById('rail-print-btn');
        const flyout = document.getElementById('rail-print-flyout');
        function closeFlyout() { flyout.classList.remove('open'); }
        btn?.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = btn.getBoundingClientRect();
            const willOpen = !flyout.classList.contains('open');
            flyout.style.top = Math.min(rect.top, window.innerHeight - flyout.offsetHeight - 20) + 'px';
            flyout.classList.toggle('open', willOpen);
        });
        document.addEventListener('click', (e) => {
            if (!flyout.contains(e.target) && e.target !== btn) closeFlyout();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFlyout(); });
    })();
</script>
