{% extends "base.html" %}

{% block topbar %}
<div class="top-bar">
  <div class="page-head">
    <h1>二维码生成</h1>
    <p class="sub">输入链接或文字，即时生成并下载高清晰度二维码</p>
  </div>
  <div class="top-actions">
    <span class="chip"><i class="bi bi-phone"></i>扫码即可查看</span>
  </div>
</div>
{% endblock %}

{% block container %}
<script src="/static/js/qrcode.min.js"></script>

<div class="d-flex flex-column align-items-center">

    <!-- Creator UI -->
    <div class="soft-card w-100" style="max-width: 520px;" id="creator-ui">
        <h2 class="card-title-mod mb-3 text-center" style="font-size:1.15rem;">
            <i class="bi bi-qr-code-scan" style="color:var(--blue)"></i> 二维码生成器
        </h2>

        <div class="search-pill mb-3">
            <i class="bi bi-link-45deg"></i>
            <input type="text" id="url-input" placeholder="输入链接或文字…" value="https://www.google.com"
                   onkeydown="if(event.key === 'Enter') createSecureQR()">
        </div>

        <button class="btn-pill btn-pill-primary btn-pill-block" onclick="createSecureQR()">
            <i class="bi bi-magic"></i> 生成二维码
        </button>

        <div id="qrcode" class="d-flex justify-content-center mt-4" style="min-height: 220px;"></div>

        <div class="d-flex gap-2 mt-4">
            <button class="btn-pill flex-fill" onclick="downloadQR('png')">
                <i class="bi bi-image"></i> 下载 PNG
            </button>
            <button class="btn-pill flex-fill" onclick="downloadQR('jpeg')">
                <i class="bi bi-file-earmark-image"></i> 下载 JPEG
            </button>
        </div>
    </div>

    <!-- Confirm UI -->
    <div class="soft-card w-100 d-none" style="max-width: 520px;" id="confirm-ui">
        <h2 class="card-title-mod mb-3 text-center" style="font-size:1.15rem;color:#2bb894;">
            <i class="bi bi-check-circle-fill"></i> 扫码确认
        </h2>
        <p id="target-display" class="fs-6 text-break text-center mb-4" style="line-height:1.6;"></p>
        <button id="action-btn" class="btn-pill btn-pill-primary btn-pill-block"></button>
    </div>

</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        // 从 URL 中获取 'data' 参数（支持中文）
        const rawData = urlParams.get('data');

        // --- 扫码后的逻辑 ---
        if (rawData) {
            document.getElementById('creator-ui').classList.add('d-none');
            document.getElementById('confirm-ui').classList.remove('d-none');

            // URLSearchParams 已经做过一次百分号解码，这里再解一次会把 "100%25" → "100%" 解成非法序列并抛 URIError
            let decodedData = rawData;
            try {
                decodedData = decodeURIComponent(rawData);
            } catch (e) {
                decodedData = rawData;   // 含孤立 '%' 等非法序列时回退到原始值，不让页面崩掉
            }
            const displayElement = document.getElementById('target-display');
            const actionBtn = document.getElementById('action-btn');

            // 安全渲染：用 DOM API + textContent，避免 innerHTML 注入（XSS）
            displayElement.textContent = '';
            if (decodedData.startsWith('http')) {
                const label = document.createElement('strong');
                label.textContent = '跳转链接：';
                const link = document.createElement('a');
                link.href = decodedData;   // 仅 http(s) 白名单，javascript: 等协议落入下方文本分支
                link.textContent = decodedData;
                displayElement.append(label, document.createElement('br'), link);
                actionBtn.innerText = "确认前往";
                actionBtn.onclick = () => window.location.href = decodedData;
            } else {
                const label = document.createElement('strong');
                label.textContent = '扫描内容：';
                displayElement.append(label, document.createElement('br'), decodedData);
                actionBtn.innerText = "已知晓";
                actionBtn.onclick = () => alert("内容已确认");
            }
        } else {
            // Initiate default QR code when loaded as creator
            setTimeout(() => {
                createSecureQR();
            }, 100);
        }
    });

    // --- 生成器的逻辑 ---
    let qrcode = null;

    function createSecureQR() {
        let inputStr = document.getElementById("url-input").value.trim();
        if (!inputStr) return alert("请输入内容");
        
        let qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // Clear existing QR

        qrcode = new QRCode(qrContainer, {
            text: inputStr,
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function downloadQR(format) {
        const qrcodeDiv = document.getElementById("qrcode");
        let canvas = qrcodeDiv.querySelector("canvas");
        let img = qrcodeDiv.querySelector("img");

        let sourceToDraw = canvas || img;
        if (!sourceToDraw) return alert("请先生成二维码！");

        // Try to construct canvas from img if only img is available (due to older browser fallback by QRCode.js)
        if (!canvas && img.src) {
            canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth || 200;
            canvas.height = img.naturalHeight || 200;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            sourceToDraw = canvas;
        }

        let padding = 15;
        let sourceWidth = canvas ? canvas.width : sourceToDraw.width;
        let sourceHeight = canvas ? canvas.height : sourceToDraw.height;

        let finalCanvas = document.createElement("canvas");
        finalCanvas.width = sourceWidth + padding * 2;
        finalCanvas.height = sourceHeight + padding * 2;

        let ctx = finalCanvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
        ctx.drawImage(sourceToDraw, padding, padding, sourceWidth, sourceHeight);

        let dataUrl = format === 'jpeg' ? finalCanvas.toDataURL("image/jpeg", 1.0) : finalCanvas.toDataURL("image/png");

        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = `qrcode.${format}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
{% endblock %}
