<script>
    (() => {
        'use strict'
        const getStoredTheme = () => localStorage.getItem('theme')
        const getPreferredTheme = () => {
            const storedTheme = getStoredTheme()
            if (storedTheme) return storedTheme
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        const setTheme = theme => {
            document.documentElement.setAttribute('data-bs-theme', theme)
        }
        setTheme(getPreferredTheme())
    })()
</script>

<style>

<script>

}

  {cn:"自定义2",en:"dingyi2",desc:"用于特殊数据",freq:0},
  {cn:"自定义3",en:"dingyi3",desc:"用于特殊数据",freq:0}
];

const data = loadData() || BASE_DATA;

function saveData() {
  localStorage.setItem('bartender_fields_2023', JSON.stringify(data));
}

const tbody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const statInfo = document.getElementById('statInfo');
const filterBtns = document.querySelectorAll('.filter-btn');
const ths = document.querySelectorAll('th[data-col]');

let filterFreq = 'all';
let searchText = '';
let sortCol = null;
let sortAsc = true;

function filterData() {
  let items = data;
  // freq filter
  if (filterFreq !== 'all') {
    const val = parseInt(filterFreq);
    items = items.filter(d => d.freq === val);
  }
  // text search
  if (searchText) {
    const t = searchText.toLowerCase();
    items = items.filter(d =>
      d.cn.toLowerCase().includes(t) ||
      d.en.toLowerCase().includes(t) ||
      (d.desc && d.desc.toLowerCase().includes(t))
    );
  }
  return items;
}

function sortData(items) {
  if (!sortCol) return items;
  const arr = [...items];
  arr.sort((a, b) => {
    let va, vb;
    if (sortCol === 'index') return 0;
    if (sortCol === 'cn') { va = a.cn; vb = b.cn; }
    else if (sortCol === 'en') { va = a.en; vb = b.en; }
    else if (sortCol === 'desc') { va = a.desc || ''; vb = b.desc || ''; }
    else if (sortCol === 'freq') { va = a.freq; vb = b.freq; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  return arr;
}

function render() {
  let items = filterData();
  items = sortData(items);

  statInfo.innerHTML = `共 <strong>${items.length}</strong> 条`;

  if (items.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">没有匹配的字段，请调整搜索条件</td></tr>';
    return;
  }

  let html = '';
  items.forEach((d, i) => {
    const freqLabel = d.freq === 1
      ? '<span class="freq-badge freq-1">✓ 常用</span>'
      : '<span class="freq-badge freq-0">— 不常用</span>';
    const desc = d.desc || '<span style="color:#ccc">—</span>';
    html += `<tr>
      <td class="col-index">${i + 1}</td>
      <td class="cn-name">${esc(d.cn)}</td>
      <td><span class="en-code">${esc(d.en)}</span></td>
      <td class="desc-text">${desc}</td>
      <td class="col-freq">${freqLabel}</td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Add Tag Modal ---
const modalOverlay = document.getElementById('modalOverlay');
const addBtn = document.getElementById('addBtn');
const modalClose = document.getElementById('modalClose');
const modalCancel = document.getElementById('modalCancel');
const modalSubmit = document.getElementById('modalSubmit');
const inputCn = document.getElementById('inputCn');
const inputEn = document.getElementById('inputEn');
const inputDesc = document.getElementById('inputDesc');
const inputFreq = document.getElementById('inputFreq');
const enError = document.getElementById('enError');
const toast = document.getElementById('toast');

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function openModal() {
  inputCn.value = '';
  inputEn.value = '';
  inputDesc.value = '';
  inputFreq.value = '1';
  enError.classList.remove('show');
  modalOverlay.classList.add('show');
  setTimeout(() => inputCn.focus(), 100);
}

function closeModal() {
  modalOverlay.classList.remove('show');
}

addBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modalCancel.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && modalOverlay.classList.contains('show')) {
    modalSubmit.click();
  }
});

inputEn.addEventListener('input', () => {
  const exists = data.some(d => d.en.toLowerCase() === inputEn.value.trim().toLowerCase());
  if (inputEn.value.trim() && exists) {
    enError.classList.add('show');
  } else {
    enError.classList.remove('show');
  }
});

modalSubmit.addEventListener('click', () => {
  const cn = inputCn.value.trim();
  const en = inputEn.value.trim();
  const desc = inputDesc.value.trim();
  const freq = parseInt(inputFreq.value);

  // Validate
  if (!cn) {
    inputCn.focus();
    inputCn.style.borderColor = '#f5222d';
    setTimeout(() => inputCn.style.borderColor = '', 1500);
    return;
  }
  if (!en) {
    inputEn.focus();
    inputEn.style.borderColor = '#f5222d';
    setTimeout(() => inputEn.style.borderColor = '', 1500);
    return;
  }
  // Check duplicate
  if (data.some(d => d.en.toLowerCase() === en.toLowerCase())) {
    enError.classList.add('show');
    inputEn.focus();
    return;
  }

  // Add to data
  data.push({ cn, en, desc, freq });
  saveData();

  // Reset sort to show newest
  sortCol = null;
  sortAsc = true;
  ths.forEach(t => t.classList.remove('sort-asc', 'sort-desc'));

  closeModal();
  render();

  // Scroll to bottom and highlight
  const rows = tbody.querySelectorAll('tr');
  if (rows.length) {
    const lastRow = rows[rows.length - 1];
    lastRow.classList.add('new-row');
    lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  showToast(`✅ 字段「${cn}」已添加`);
});

// Events
searchInput.addEventListener('input', () => {
  searchText = searchInput.value;
  render();
});

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterFreq = btn.dataset.freq;
    render();
  });
});

ths.forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = true;
    }
    ths.forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
    th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    render();
  });
});

render();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
