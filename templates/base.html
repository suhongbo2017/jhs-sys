<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/LOGO英文原文件.ico">
    <script src="/static/js/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/css/jquery.dataTables.min.css" />
    <script src="/static/js/jquery.dataTables.min.js"></script>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" media="print" href="/static/css/print.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
    <script>
        (() => {
            'use strict'
            const getStoredTheme = () => localStorage.getItem('theme')
            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme()
                if (storedTheme) return storedTheme
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            }
            const setTheme = theme => {
                document.documentElement.setAttribute('data-bs-theme', theme)
            }
            setTheme(getPreferredTheme())
        })()
    </script>
    <title>金恒晟新材料科技有限公司</title>
    
</head>
<body class="d-flex flex-column justify-content-center">

    {% include "nav.html" %}

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="container-fluid px-4 mt-3" style="max-width: 1200px;">
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'warning' if category == 'warning' else 'info' }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block input %}{% endblock %}
    {% block container %}{% endblock %}
    {% block map %}{% endblock %}


    <script src="/static/js/datatables.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
