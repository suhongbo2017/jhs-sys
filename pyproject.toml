[project]
name = "jhssystem"
version = "0.1.0"
description = "A Flask application for querying Kingdee database delivery and material information."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 范围两端均覆盖生产 .venv 实测版本与可升级空间；上限防止未来大版本不兼容
    "flask>=2.3.3,<4",
    "Bootstrap-Flask>=2.2.0",
    "pandas>=2.2",
    "pyodbc>=4.0.39",
    "sqlalchemy>=2.0.17",
    "waitress>=3.0.0",           # Windows 生产 (wsgi.py)
    "gunicorn>=21.2.0",          # Linux/Docker 部署
    "mysql-connector-python>=8.0.0,<9.0.0",
    "PyDeepLX>=0.1.0",
    "pywebview>=4.3.2",          # 桌面客户端 (gui_launcher.py)
    "pyinstaller>=6.7.0",        # 打包
]
